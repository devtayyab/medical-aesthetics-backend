server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Web push service worker: served from the site root as JavaScript (never the SPA
    # index.html fallback) and never cached, so updates reach browsers.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Handle React Client Routing (SPA)
    # Any request that doesn't match a file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded files directly via Nginx for better performance
    location /api/uploads/ {
        alias /usr/share/nginx/html/uploads/;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle Socket.io WebSockets
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Serve uploaded files if they are stored locally
    # location /uploads/ {
    #     proxy_pass http://backend:3001/uploads/;
    # }
}
