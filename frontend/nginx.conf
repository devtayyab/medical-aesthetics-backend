server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers for every response. nginx drops server-level add_header in any
    # location that sets its own add_header, so those locations repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Web push service worker: served from the site root as JavaScript (never the SPA
    # index.html fallback) and never cached, so updates reach browsers.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy reaches users at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    # Vite build output: file names carry a content hash, so they can be cached for a year.
    # A missing asset is a 404, never index.html (HTML loaded as a script after a deploy).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Uploaded files also sit under the web root (docker-compose volume). An uploaded HTML or
    # SVG file must never run script on this origin; images still render in <img>.
    location /uploads/ {
        add_header Cache-Control "public, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    # Handle React Client Routing (SPA)
    # Any request that doesn't match a file falls back to index.html (no-cache via the
    # location above, because the fallback is an internal redirect to /index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded files directly via Nginx for better performance
    location /api/uploads/ {
        alias /usr/share/nginx/html/uploads/;
        add_header Cache-Control "public, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        access_log off;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle Socket.io WebSockets
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Serve uploaded files if they are stored locally
    # location /uploads/ {
    #     proxy_pass http://backend:3001/uploads/;
    # }
}
